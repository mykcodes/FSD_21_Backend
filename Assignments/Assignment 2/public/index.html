<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Help Desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Campus Help Desk</h1>
      <p>Submit and manage campus-related problems or requests.</p>
    </header>

    <main>
      <section class="form-section">
        <h2 id="formTitle">Submit a Request</h2>
        <form id="requestForm">
          <input type="hidden" id="requestId">
          
          <div class="form-group">
            <label for="studentName">Student Name *</label>
            <input type="text" id="studentName" required placeholder="Enter your name">
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" required placeholder="Enter your email">
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="Academic">Academic</option>
              <option value="Hostel">Hostel</option>
              <option value="Infrastructure">Infrastructure</option>
              <option value="Transport">Transport</option>
              <option value="IT / Technical">IT / Technical</option>
              <option value="Administration">Administration</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Problem Description *</label>
            <textarea id="description" rows="4" required placeholder="Describe your problem or request..."></textarea>
          </div>

          <div class="form-group">
            <label for="priority">Priority *</label>
            <select id="priority" required>
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">Submit Request</button>
            <button type="button" id="cancelBtn" class="btn btn-secondary hidden">Cancel Edit</button>
          </div>
          
          <div id="formMessage" class="message hidden"></div>
        </form>
      </section>

      <section class="list-section">
        <h2>Submitted Requests</h2>
        <div id="loadingMessage" class="loading">Loading requests...</div>
        <div id="requestsList" class="requests-grid">
          <!-- Requests will be injected here -->
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
